<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0F2D5E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Cash/Order"/>
<title>Raghav Enterprises – Cash/Order</title>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --navy:#0F2D5E;--navy-md:#1A4080;--navy-lt:#E8EDF7;
  --saffron:#E8520A;--saffron-lt:#FEF0EA;--saffron-dk:#C04208;
  --ink:#1C1C2E;--muted:#6B7280;--hint:#9CA3AF;
  --bg:#F4F6FB;--surface:#FFFFFF;--surface2:#F0F2F8;
  --border:#E2E6EE;--border-md:#C9D0DE;
  --green:#16A34A;--green-lt:#DCFCE7;
  --amber:#D97706;--amber-lt:#FEF3C7;
  --red:#DC2626;--red-lt:#FEE2E2;
  --rad:14px;--rad-sm:9px;--rad-xs:6px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --font:'Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;overscroll-behavior:none;}
button,input,select,textarea{font-family:var(--font);}

/* ── App Layout ── */
#app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
.topbar{background:var(--navy);color:#fff;padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;gap:12px;flex-shrink:0;}
.topbar-title{font-size:16px;font-weight:700;flex:1;}
.topbar-user{font-size:11px;color:rgba(255,255,255,.6);}
.topbar-logout{background:rgba(255,255,255,.15);border:none;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;}
.content{flex:1;overflow-y:auto;padding:16px;}

/* ── Login Screen ── */
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.login-box{background:var(--surface);border-radius:var(--rad);padding:32px 24px;width:100%;max-width:340px;box-shadow:0 4px 16px rgba(0,0,0,.08);}
.login-box .brand{text-align:center;margin-bottom:28px;}
.login-box .brand-icon{font-size:48px;margin-bottom:12px;}
.login-box .brand-name{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px;}
.login-box .brand-sub{font-size:12px;color:var(--muted);}
.form-group{margin-bottom:16px;}
.form-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:5px;}
.form-control{width:100%;border:1px solid var(--border-md);border-radius:var(--rad-sm);padding:12px 14px;font-size:14px;background:var(--surface);color:var(--ink);outline:none;transition:border-color .15s;}
.form-control:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(15,45,94,.1);}
.btn{border:none;border-radius:var(--rad-sm);padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;width:100%;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--saffron);color:#fff;}
.btn-primary:hover{background:var(--saffron-dk);}
.btn-navy{background:var(--navy);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border-md);color:var(--ink);}

/* ── Order Builder ── */
.section{display:none;}
.section.active{display:block;}

/* ── Quick Stats ── */
.stats-bar{display:flex;gap:12px;margin-bottom:16px;padding:12px;background:var(--navy-lt);border-radius:var(--rad-sm);}
.stat{flex:1;text-align:center;}
.stat-val{font-size:18px;font-weight:700;color:var(--navy);}
.stat-lbl{font-size:10px;color:var(--muted);margin-top:2px;}

/* ── Product List ── */
.prod-row{display:flex;align-items:center;gap:12px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .1s;}
.prod-row:hover{background:var(--surface2);}
.prod-thumb{width:44px;height:44px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden;}
.prod-thumb img{width:100%;height:100%;object-fit:cover;}
.prod-info{flex:1;min-width:0;}
.prod-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prod-meta{font-size:11px;color:var(--muted);margin-top:2px;}
.prod-price{font-size:13px;font-weight:700;color:var(--saffron);text-align:right;}
.prod-qty{width:60px;display:flex;align-items:center;justify-content:flex-end;}
.qty-input{width:50px;border:1px solid var(--border-md);border-radius:4px;padding:6px;text-align:center;font-size:12px;font-weight:600;color:var(--saffron);background:var(--saffron-lt);}

/* ── Cart ── */
.cart-item{display:grid;grid-template-columns:1fr 60px 40px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.cart-item:last-child{border-bottom:none;}
.ci-name{font-size:12px;font-weight:600;}
.ci-qty{text-align:center;font-size:13px;font-weight:700;}
.ci-total{text-align:right;font-size:13px;font-weight:700;color:var(--saffron);}
.ci-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:0;}

/* ── Total Box ── */
.total-box{background:var(--navy);color:#fff;border-radius:var(--rad-sm);padding:14px 16px;margin:16px 0;}
.tb-row{display:flex;justify-content:space-between;font-size:12px;opacity:.75;padding:3px 0;}
.tb-grand{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.2);margin-top:8px;padding-top:10px;}
.tb-grand .lbl{font-size:13px;opacity:.9;}
.tb-grand .amt{font-size:20px;font-weight:700;}

/* ── Forms ── */
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
.form-row.full{grid-template-columns:1fr;}
textarea.form-control{resize:vertical;min-height:60px;line-height:1.5;}
.radio-group{display:flex;gap:10px;margin-bottom:12px;}
.radio-opt{flex:1;}
.radio-opt input{display:none;}
.radio-opt input:checked + .radio-label{background:var(--navy);color:#fff;border-color:var(--navy);}
.radio-label{display:block;padding:10px;border:1px solid var(--border-md);border-radius:var(--rad-xs);text-align:center;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;}

/* ── Submit ── */
.submit-wrap{display:flex;gap:10px;margin-top:16px;}
.submit-wrap .btn{flex:1;}

/* ── Empty ── */
.empty{text-align:center;padding:40px 20px;color:var(--muted);}
.empty i{font-size:40px;display:block;margin-bottom:10px;color:var(--border-md);}

/* ── Toast ── */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1C1C2E;color:#fff;font-size:13px;font-weight:600;padding:10px 20px;border-radius:24px;z-index:9999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:90%;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ── Responsive ── */
@media(max-width:600px){
  .form-row{grid-template-columns:1fr;}
  .stats-bar{flex-direction:column;}
}
</style>
</head>
<body>
<div id="app">

<!-- ══ LOGIN SCREEN ══ -->
<div id="login-screen">
  <div class="login-box">
    <div class="brand">
      <div class="brand-icon">💳</div>
      <div class="brand-name">RAGHAV ENTERPRISES</div>
      <div class="brand-sub">Cash / Order Counter</div>
    </div>
    <div class="form-group">
      <label class="form-label">Staff username</label>
      <input class="form-control" type="text" id="login-user" placeholder="e.g. baburaj" autocomplete="off"/>
    </div>
    <div class="form-group">
      <label class="form-label">PIN</label>
      <input class="form-control" type="password" id="login-pin" placeholder="4-digit PIN" autocomplete="off" maxlength="4"/>
    </div>
    <button class="btn btn-primary" onclick="handleLogin()">Login</button>
  </div>
</div>

<!-- ══ MAIN APP ══ -->
<div id="main-app" style="display:none;flex-direction:column;height:100%;">
  
  <!-- Topbar -->
  <div class="topbar">
    <div>
      <div class="topbar-title">Cash / Order</div>
      <div class="topbar-user" id="topbar-user">Logged in as: —</div>
    </div>
    <button class="topbar-logout" onclick="handleLogout()"><i class="ti ti-logout" style="margin-right:4px;"></i>Logout</button>
  </div>

  <!-- Content -->
  <div class="content">

    <!-- ── SECTION: SEARCH PRODUCTS ── -->
    <div id="sec-products" class="section active">
      <div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;">
        <input class="form-control" type="search" id="prod-search" placeholder="Search products..." oninput="renderProducts()" style="flex:1;min-width:160px;"/>
        <button class="btn btn-navy" onclick="goToOrder()" style="width:auto;">Next: Order Details →</button>
      </div>
      <div id="products-list"></div>
    </div>

    <!-- ── SECTION: ORDER DETAILS ── -->
    <div id="sec-order" class="section">
      <button class="btn btn-ghost" onclick="goToProducts()" style="margin-bottom:16px;width:100%;"><i class="ti ti-arrow-left"></i> Back to products</button>
      
      <!-- Cart summary -->
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-val" id="cart-items">0</div>
          <div class="stat-lbl">Items</div>
        </div>
        <div class="stat">
          <div class="stat-val" id="cart-total">₹0</div>
          <div class="stat-lbl">Total</div>
        </div>
      </div>

      <!-- Current cart items -->
      <div style="background:var(--surface);border-radius:var(--rad-sm);padding:14px;margin-bottom:16px;">
        <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:10px;">Order items</div>
        <div id="cart-display"></div>
      </div>

      <!-- Customer details -->
      <div style="background:var(--surface);border-radius:var(--rad);padding:16px;margin-bottom:16px;">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);">Customer information</div>
        
        <div class="form-row full">
          <div class="form-group">
            <label class="form-label">Customer name *</label>
            <input class="form-control" type="text" id="ord-custname" placeholder="e.g. Abad Builders" autocomplete="off"/>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input class="form-control" type="tel" id="ord-phone" placeholder="+91 98765 43210"/>
          </div>
          <div class="form-group">
            <label class="form-label">Email (optional)</label>
            <input class="form-control" type="email" id="ord-email" placeholder="customer@company.com"/>
          </div>
        </div>
      </div>

      <!-- Delivery options -->
      <div style="background:var(--surface);border-radius:var(--rad);padding:16px;margin-bottom:16px;">
        <div style="font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--border);">Delivery option</div>
        
        <div class="radio-group">
          <div class="radio-opt">
            <input type="radio" id="delivery-collect" name="delivery" value="collect" checked onchange="toggleDeliveryFields()"/>
            <label class="radio-label" for="delivery-collect">Collect from store</label>
          </div>
          <div class="radio-opt">
            <input type="radio" id="delivery-delivery" name="delivery" value="delivery" onchange="toggleDeliveryFields()"/>
            <label class="radio-label" for="delivery-delivery">Delivery</label>
          </div>
        </div>

        <div id="delivery-cost-field" style="display:none;">
          <div class="form-group">
            <label class="form-label">Delivery cost (₹)</label>
            <input class="form-control" type="number" id="delivery-cost" placeholder="0.00" value="0"/>
          </div>
          <div class="form-group">
            <label class="form-label">Delivery address (optional)</label>
            <textarea class="form-control" id="delivery-address" placeholder="Customer delivery location…"></textarea>
          </div>
        </div>
      </div>

      <!-- Order notes -->
      <div style="background:var(--surface);border-radius:var(--rad);padding:16px;margin-bottom:16px;">
        <div class="form-group">
          <label class="form-label">Order notes (optional)</label>
          <textarea class="form-control" id="ord-notes" placeholder="Special instructions, urgency, etc.…"></textarea>
        </div>
      </div>

      <!-- Discount (frozen) -->
      <div style="background:var(--surface2);border-radius:var(--rad-sm);padding:12px 14px;margin-bottom:16px;border-left:3px solid var(--border);opacity:.6;">
        <div style="font-size:11px;color:var(--muted);margin-bottom:4px;">Discount (Manager approval required)</div>
        <div style="font-size:13px;font-weight:700;color:var(--navy);">0% — Frozen at counter</div>
      </div>

      <!-- Total -->
      <div class="total-box">
        <div class="tb-row"><span>Subtotal</span><span id="final-subtotal">₹0</span></div>
        <div class="tb-row"><span>Delivery cost</span><span id="final-delivery">₹0</span></div>
        <div class="tb-grand"><span class="lbl">Grand Total</span><span class="amt" id="final-grand">₹0</span></div>
      </div>

      <!-- Submit -->
      <div class="submit-wrap">
        <button class="btn btn-primary" onclick="submitOrder()"><i class="ti ti-send"></i> Submit order</button>
        <button class="btn btn-ghost" onclick="goToProducts()"><i class="ti ti-arrow-left"></i> Back</button>
      </div>
    </div>

  </div>

</div>

</div>

<div id="toast"></div>

<script>
// ── Supabase ──
const SUPA_URL = 'https://cuxfvbtvmosmgvptygjy.supabase.co';
const SUPA_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1eGZ2YnR2bW9zbWd2cHR5Z2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDk5NzYsImV4cCI6MjA5NjA4NTk3Nn0.tuSqeeKONTldWAX1mDwXJAuIjs3o2amcNbfvns-OH4o';
const supa = supabase.createClient(SUPA_URL, SUPA_KEY);

// ── Config ──
const STAFF_LOGINS = {
  baburaj: '1111',
  selvin: '2222',
  warehouse: '3333',
};
const COMPANY = 'RAGHAV ENTERPRISES';
const COMPANY_ADDR = 'TD Building, TD Road, Ernakulam – 682035';
const COMPANY_GSTIN = '32AAKFR8673C1Z3';

// ── State ──
let currentUser = null;
let allProducts = [];
let cart = {}; // id → {name, unit, qty, base_price, gst_pct, hsn_code}

function fmt(n){ return '₹' + Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'),2400);
}

// ── Login ──
function handleLogin(){
  const user = document.getElementById('login-user').value.toLowerCase().trim();
  const pin  = document.getElementById('login-pin').value.trim();
  if(!user || !pin){ toast('Enter username and PIN'); return; }
  if(STAFF_LOGINS[user] !== pin){ toast('Invalid credentials'); return; }
  currentUser = user;
  document.getElementById('topbar-user').textContent = `Logged in as: ${user.charAt(0).toUpperCase()+user.slice(1)}`;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-app').style.display = 'flex';
  loadProducts();
}

function handleLogout(){
  if(!confirm('Logout?')) return;
  currentUser = null;
  cart = {};
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-app').style.display = 'none';
  document.getElementById('login-user').value = '';
  document.getElementById('login-pin').value = '';
  document.getElementById('login-user').focus();
}

// ── Load Products ──
async function loadProducts(){
  toast('Loading products...');
  const { data } = await supa.from('products').select('*').eq('is_active',true).order('category').order('name');
  allProducts = (data||[]).map(p=>({
    id: p.id, name: p.name, cat: p.category||'',
    photo: p.photo_url||null, emoji: p.emoji||'📦',
    price: parseFloat(p.base_price), gst: parseFloat(p.gst_pct),
    hsn: p.hsn_code||'', unit: p.unit||'',
  }));
  renderProducts();
  toast('Catalogue ready');
}

function renderProducts(){
  const q = (document.getElementById('prod-search').value||'').toLowerCase();
  const filtered = allProducts.filter(p=>!q||p.name.toLowerCase().includes(q)||(p.cat||'').toLowerCase().includes(q));
  document.getElementById('products-list').innerHTML = filtered.length
    ? filtered.map(p=>{
        const thumb = p.photo ? `<img src="${p.photo}" style="width:44px;height:44px;object-fit:cover;border-radius:8px;"/>` : `<div class="prod-thumb">${p.emoji}</div>`;
        const total = p.price*(1+p.gst/100);
        const qty = cart[p.id]?.qty || 0;
        return `<div class="prod-row" onclick="addToCart(${p.id},'${p.name}','${p.unit}',${p.price},${p.gst},'${p.hsn}')">
          ${thumb}
          <div class="prod-info">
            <div class="prod-name">${p.name}</div>
            <div class="prod-meta">${p.cat}${p.unit?' · '+p.unit:''} · HSN ${p.hsn||'—'}</div>
          </div>
          <div style="text-align:right;">
            <div class="prod-price">${fmt(total)}</div>
            ${qty>0?`<div style="font-size:11px;color:var(--saffron);font-weight:700;margin-top:2px;">${qty} in cart</div>`:''}
          </div>
        </div>`;
      }).join('')
    : '<div class="empty"><i class="ti ti-package-off"></i><p>No products found</p></div>';
}

function addToCart(id,name,unit,price,gst,hsn){
  if(!cart[id]){
    cart[id] = {name,unit,qty:1,price,gst,hsn};
  } else {
    cart[id].qty++;
  }
  renderProducts();
  updateCart();
  toast(`${name} added to cart`);
}

function removeFromCart(id){
  delete cart[id];
  updateCart();
  renderProducts();
}

function updateQty(id,qty){
  const q = parseInt(qty)||0;
  if(q<=0){ delete cart[id]; } else { cart[id].qty = q; }
  updateCart();
}

function updateCart(){
  const items = Object.values(cart).length;
  let sub = 0;
  Object.values(cart).forEach(it=>{ sub += it.price * it.qty; });
  const total = sub * 1.18; // rough, actual is per item
  document.getElementById('cart-items').textContent = items;
  document.getElementById('cart-total').textContent = fmt(total);

  // Display items
  document.getElementById('cart-display').innerHTML = Object.entries(cart).length
    ? Object.entries(cart).map(([id,it])=>{
        const lineTotal = it.price*it.qty*(1+it.gst/100);
        return `<div class="cart-item">
          <div><div class="ci-name">${it.name}</div><div style="font-size:10px;color:var(--muted);">${it.qty}×${fmt(it.price)}</div></div>
          <input type="number" class="qty-input" value="${it.qty}" min="1" onchange="updateQty(${id},this.value)"/>
          <div style="text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px;">
            <div class="ci-total">${fmt(lineTotal)}</div>
            <button class="ci-remove" onclick="removeFromCart(${id})"><i class="ti ti-trash"></i></button>
          </div>
        </div>`;
      }).join('')
    : '<div style="color:var(--muted);font-size:12px;padding:10px;text-align:center;">No items added yet</div>';
}

function toggleDeliveryFields(){
  const mode = document.querySelector('input[name="delivery"]:checked').value;
  document.getElementById('delivery-cost-field').style.display = mode==='delivery'?'block':'none';
  updateFinalTotal();
}

function updateFinalTotal(){
  let sub = 0;
  Object.values(cart).forEach(it=>{ sub += it.price*it.qty*(1+it.gst/100); });
  const delCost = parseFloat(document.getElementById('delivery-cost').value)||0;
  const grand = sub + delCost;
  document.getElementById('final-subtotal').textContent = fmt(sub);
  document.getElementById('final-delivery').textContent = fmt(delCost);
  document.getElementById('final-grand').textContent = fmt(grand);
}

function goToProducts(){
  document.getElementById('sec-products').classList.add('active');
  document.getElementById('sec-order').classList.remove('active');
}

function goToOrder(){
  const items = Object.keys(cart).length;
  if(!items){ toast('Add products first'); return; }
  updateCart();
  updateFinalTotal();
  document.getElementById('sec-products').classList.remove('active');
  document.getElementById('sec-order').classList.add('active');
}

async function submitOrder(){
  const custName = document.getElementById('ord-custname').value.trim();
  if(!custName){ toast('Enter customer name'); return; }
  const items = Object.keys(cart);
  if(!items.length){ toast('Add products'); return; }

  const phone = document.getElementById('ord-phone').value.trim();
  const email = document.getElementById('ord-email').value.trim();
  const delivery = document.querySelector('input[name="delivery"]:checked').value;
  const delCost = parseFloat(document.getElementById('delivery-cost').value)||0;
  const delAddr = document.getElementById('delivery-address').value.trim();
  const notes = document.getElementById('ord-notes').value.trim();

  toast('Saving order...');
  try {
    // Upsert customer
    const { data: existing } = await supa.from('customers').select('id').ilike('company_name',custName).maybeSingle();
    let custId = null;
    if(existing){
      custId = existing.id;
      await supa.from('customers').update({phone,email}).eq('id',custId);
    } else {
      const { data: nc } = await supa.from('customers').insert({
        company_name: custName, phone, email, billing_city: delAddr||'Ernakulam',
      }).select('id').single();
      if(nc) custId = nc.id;
    }

    // Create order
    const ref = 'SO-'+Date.now().toString().slice(-6);
    const { data: ord, error: ordErr } = await supa.from('store_orders').insert({
      order_ref: ref, staff_name: currentUser,
      customer_id: custId, status: 'pending',
      delivery_mode: delivery, delivery_cost: delCost,
      delivery_address: delAddr,
      notes: notes,
      created_at: new Date().toISOString(),
    }).select('id').single();
    if(ordErr) throw ordErr;

    // Add line items
    const lineItems = items.map(id=>{
      const it = cart[id];
      return {
        order_id: ord.id, product_id: id, product_name: it.name,
        hsn_code: it.hsn, unit: it.unit, qty: it.qty,
        base_price: it.price, gst_pct: it.gst, discount_pct: 0,
      };
    });
    const { error: itemErr } = await supa.from('store_items').insert(lineItems);
    if(itemErr) throw itemErr;

    toast(`Order ${ref} submitted ✓`);
    // Reset
    cart = {};
    document.getElementById('ord-custname').value = '';
    document.getElementById('ord-phone').value = '';
    document.getElementById('ord-email').value = '';
    document.getElementById('ord-notes').value = '';
    document.getElementById('delivery-cost').value = '0';
    document.getElementById('delivery-address').value = '';
    goToProducts();
    loadProducts();
  } catch(e){
    toast('Error — check connection');
    console.error(e);
  }
}

// Boot
window.addEventListener('DOMContentLoaded',()=>{
  document.getElementById('login-user').focus();
  if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
});
</script>
</body>
