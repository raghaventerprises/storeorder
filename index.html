<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raghav Enterprises – Store</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root {
  --navy: #0F2D5E;
  --saffron: #E8520A;
  --white: #FFFFFF;
  --light-bg: #F4F6FB;
  --border: #E2E6EE;
  --text: #1C1C2E;
  --muted: #6B7280;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: 'Plus Jakarta Sans', sans-serif;
  background: var(--light-bg);
  color: var(--text);
}

.app { max-width: 600px; margin: 0 auto; background: var(--white); min-height: 100vh; display: flex; flex-direction: column; }

.header {
  background: var(--navy);
  color: var(--white);
  padding: 20px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,.1);
}

.header h1 { font-size: 24px; margin-bottom: 5px; }
.header p { font-size: 12px; opacity: 0.8; }

.content { flex: 1; padding: 20px; overflow-y: auto; }

.section { display: none; }
.section.active { display: block; }

/* LOGIN */
.login-box {
  max-width: 400px;
  margin: 40px auto;
  padding: 40px 30px;
  text-align: center;
}

.login-icon { font-size: 48px; margin-bottom: 20px; }
.login-box h2 { color: var(--navy); margin-bottom: 10px; font-size: 20px; }
.login-box p { color: var(--muted); margin-bottom: 30px; font-size: 13px; }

/* FORM */
input, select, textarea {
  width: 100%;
  padding: 12px 14px;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
}

input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--saffron);
  box-shadow: 0 0 0 3px rgba(232, 82, 10, 0.1);
}

label {
  display: block;
  margin-top: 15px;
  font-weight: 600;
  color: var(--text);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}

/* BUTTONS */
button {
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: none;
  border-radius: 8px;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}

.btn-primary {
  background: var(--saffron);
  color: var(--white);
}

.btn-primary:hover { background: #C04208; }

.btn-secondary {
  background: var(--navy);
  color: var(--white);
}

.btn-secondary:hover { background: #1A4080; }

.btn-danger {
  background: #DC2626;
  color: var(--white);
  width: auto;
  padding: 8px 16px;
}

.btn-small {
  width: auto;
  padding: 8px 16px;
  margin: 5px 5px 5px 0;
  font-size: 12px;
}

/* CARDS */
.order-card {
  border: 1px solid var(--border);
  padding: 15px;
  margin: 10px 0;
  border-radius: 8px;
  background: var(--white);
  transition: all 0.2s;
}

.order-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.1); }

.order-card-ref {
  font-weight: 700;
  color: var(--navy);
  font-size: 14px;
}

.order-card-status {
  display: inline-block;
  background: #FEF0EA;
  color: var(--saffron);
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  margin-left: 10px;
}

.order-card-customer {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.product {
  border: 1px solid var(--border);
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  cursor: pointer;
  background: var(--light-bg);
  transition: all 0.2s;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.product:hover {
  background: var(--white);
  border-color: var(--saffron);
  box-shadow: 0 2px 8px rgba(232, 82, 10, 0.15);
}

.product-info { flex: 1; }
.product-name { font-weight: 600; color: var(--text); }
.product-detail { font-size: 11px; color: var(--muted); margin-top: 3px; }
.product-price { 
  color: var(--saffron);
  font-weight: 700;
  font-size: 16px;
  text-align: right;
  min-width: 80px;
}

/* CART */
.cart-item {
  border: 1px solid var(--border);
  padding: 12px;
  margin: 8px 0;
  border-radius: 8px;
  background: var(--light-bg);
  display: grid;
  grid-template-columns: 1fr 60px 70px;
  gap: 10px;
  align-items: center;
}

.cart-item-details { min-width: 0; }
.cart-item-name { font-weight: 600; font-size: 13px; }
.cart-item-detail { font-size: 11px; color: var(--muted); margin-top: 2px; }
.cart-item-total { 
  text-align: right;
  font-weight: 700;
  color: var(--saffron);
  font-size: 14px;
}

.qty-input {
  width: 100%;
  text-align: center;
  padding: 8px !important;
  margin: 0 !important;
  font-weight: 600;
  background: #FEF0EA !important;
  color: var(--saffron) !important;
}

/* BREAKDOWN & TOTAL */
.breakdown {
  background: #E8EDF7;
  border-radius: 8px;
  padding: 12px;
  margin: 12px 0;
  font-size: 12px;
}

.breakdown-row {
  display: flex;
  justify-content: space-between;
  padding: 4px 0;
}

.breakdown-row.total {
  font-weight: 700;
  border-top: 1px solid var(--border);
  padding-top: 6px;
  margin-top: 6px;
}

.total-box {
  background: var(--navy);
  color: var(--white);
  padding: 18px;
  border-radius: 8px;
  margin: 16px 0;
  text-align: center;
}

.total-label { font-size: 12px; opacity: 0.8; }
.total-amount { 
  font-size: 28px;
  font-weight: 700;
  margin-top: 5px;
}

/* MESSAGES */
.message {
  padding: 12px;
  border-radius: 8px;
  margin: 10px 0;
  font-size: 13px;
}

.error {
  background: #FEE2E2;
  color: #DC2626;
  border: 1px solid #FECACA;
}

.success {
  background: #DCFCE7;
  color: #16A34A;
  border: 1px solid #BBF7D0;
}

/* UTILITIES */
.text-center { text-align: center; }
.mt-20 { margin-top: 20px; }
.mb-10 { margin-bottom: 10px; }
.divider { height: 1px; background: var(--border); margin: 15px 0; }

h2 { font-size: 18px; margin-bottom: 15px; color: var(--navy); }
h3 { font-size: 14px; margin-top: 15px; margin-bottom: 10px; color: var(--text); }
p { color: var(--muted); font-size: 13px; }

@media (max-width: 600px) {
  .header { padding: 15px; }
  .content { padding: 15px; }
  .login-box { margin: 30px auto; padding: 30px 20px; }
}
</style>
</head>
<body>

<div class="app">
  
  <!-- HEADER -->
  <div class="header">
    <h1>💳 Raghav Enterprises</h1>
    <p id="username-display">Store Counter Management</p>
  </div>

  <div class="content">

    <!-- LOGIN SCREEN -->
    <div id="login-section" class="section active">
      <div class="login-box">
        <div class="login-icon">🔐</div>
        <h2>Staff Login</h2>
        <p>Enter your credentials to continue</p>
        
        <input type="text" id="login-user" placeholder="Username: baburaj, selvin, warehouse" autocomplete="off">
        <input type="password" id="login-pin" placeholder="PIN (4 digits)" maxlength="4" autocomplete="off">
        
        <button class="btn-secondary" onclick="login()">Login</button>
        <div id="login-message" class="message" style="display:none;"></div>
      </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard-section" class="section">
      <h2>Your Orders</h2>
      <button class="btn-primary" onclick="goNewOrder()">+ New Order</button>
      
      <div class="divider"></div>
      <h3>Recent Orders</h3>
      <div id="orders-list"></div>
      
      <button class="btn-danger" style="margin-top:20px;" onclick="logout()">Logout</button>
    </div>

    <!-- NEW ORDER -->
    <div id="order-section" class="section">
      <button class="btn-secondary btn-small" onclick="goDashboard()">← Back to Dashboard</button>
      
      <h2>Create New Order</h2>

      <label>Customer Name *</label>
      <input type="text" id="cust-name" placeholder="e.g. ABC Builders">
      
      <label>Phone Number</label>
      <input type="tel" id="cust-phone" placeholder="+91 98765 43210">

      <label>Select Product *</label>
      <div id="products-container" style="max-height: 250px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; padding: 8px;"></div>

      <label>Delivery Method *</label>
      <select id="delivery-type" onchange="toggleDeliveryFields()">
        <option value="collect">Collect from Store</option>
        <option value="delivery">Delivery to Site</option>
      </select>

      <div id="delivery-section" style="display:none;">
        <label>Delivery Address *</label>
        <textarea id="delivery-addr" placeholder="Project/Site location..." rows="3"></textarea>
        
        <label>Delivery Cost (₹)</label>
        <input type="number" id="delivery-cost" value="0" onchange="updateTotal()">
        
        <label>Logistics Partner</label>
        <input type="text" id="logistics" placeholder="Name or company handling delivery">
      </div>

      <label>Payment Type</label>
      <select id="payment-type">
        <option value="cash">Cash</option>
        <option value="credit">Credit</option>
      </select>

      <label>Special Notes</label>
      <textarea id="order-notes" placeholder="Urgency, special instructions, etc..." rows="2"></textarea>

      <h3>Order Items</h3>
      <div id="order-items"></div>

      <div class="breakdown">
        <div class="breakdown-row">
          <span>Subtotal (excl. GST)</span>
          <span id="br-subtotal">₹0</span>
        </div>
        <div class="breakdown-row">
          <span>Total GST</span>
          <span id="br-gst">₹0</span>
        </div>
        <div class="breakdown-row">
          <span>Delivery Cost</span>
          <span id="br-delivery">₹0</span>
        </div>
        <div class="breakdown-row total">
          <span>Grand Total</span>
          <span id="br-total">₹0</span>
        </div>
      </div>

      <button class="btn-primary" onclick="submitOrder()">✓ Submit Order</button>
      <button class="btn-secondary" style="background: #6B7280;" onclick="resetForm()">Clear Form</button>
      
      <div id="order-message" class="message" style="display:none;"></div>
    </div>

  </div>

</div>

<script>
const SUPABASE_URL = 'https://cuxfvbtvmosmgvptygjy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1eGZ2YnR2bW9zbWd2cHR5Z2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDk5NzYsImV4cCI6MjA5NjA4NTk3Nn0.tuSqeeKONTldWAX1mDwXJAuIjs3o2amcNbfvns-OH4o';

let supabase = null;
if (window.supabase) {
  supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}

const STAFF = { baburaj: '1111', selvin: '2222', warehouse: '3333' };

let currentUser = null;
let allProducts = [];
let orderCart = {};

function showMsg(elemId, text, type) {
  const elem = document.getElementById(elemId);
  elem.textContent = text;
  elem.className = 'message ' + type;
  elem.style.display = 'block';
}

function login() {
  const user = document.getElementById('login-user').value.toLowerCase().trim();
  const pin = document.getElementById('login-pin').value.trim();
  
  if (!user || !pin) {
    showMsg('login-message', 'Enter username and PIN', 'error');
    return;
  }
  
  if (STAFF[user] !== pin) {
    showMsg('login-message', 'Invalid credentials', 'error');
    return;
  }
  
  currentUser = user;
  document.getElementById('username-display').textContent = '👤 ' + user.toUpperCase();
  document.getElementById('login-section').classList.remove('active');
  document.getElementById('dashboard-section').classList.add('active');
  
  loadProducts();
  loadOrders();
}

function logout() {
  currentUser = null;
  orderCart = {};
  document.getElementById('login-section').classList.add('active');
  document.getElementById('dashboard-section').classList.remove('active');
  document.getElementById('order-section').classList.remove('active');
  document.getElementById('login-user').value = '';
  document.getElementById('login-pin').value = '';
}

function goDashboard() {
  document.getElementById('order-section').classList.remove('active');
  document.getElementById('dashboard-section').classList.add('active');
  loadOrders();
}

function goNewOrder() {
  resetForm();
  document.getElementById('dashboard-section').classList.remove('active');
  document.getElementById('order-section').classList.add('active');
}

async function loadProducts() {
  try {
    const { data, error } = await supabase
      .from('products')
      .select('id, name, base_price, gst_pct, unit, hsn_code')
      .eq('is_active', true)
      .order('name');
    
    if (error) throw error;
    allProducts = data || [];
    displayProducts();
  } catch (err) {
    console.error('Products error:', err);
    document.getElementById('products-container').innerHTML = '<p style="color:red;">Error loading products</p>';
  }
}

function displayProducts() {
  const container = document.getElementById('products-container');
  
  if (!allProducts.length) {
    container.innerHTML = '<p>No products available</p>';
    return;
  }
  
  container.innerHTML = allProducts.map(p => `
    <div class="product" onclick="addProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.base_price}, ${p.gst_pct}, '${p.unit}', '${p.hsn_code}')">
      <div class="product-info">
        <div class="product-name">${p.name}</div>
        <div class="product-detail">${p.unit} | HSN: ${p.hsn_code}</div>
      </div>
      <div class="product-price">₹${parseFloat(p.base_price).toFixed(0)}</div>
    </div>
  `).join('');
}

function addProduct(id, name, price, gst, unit, hsn) {
  const qty = prompt(`How many ${unit} of ${name}?`, '1');
  if (!qty || isNaN(qty) || qty <= 0) return;
  
  orderCart[id] = {
    name, price: parseFloat(price), gst: parseFloat(gst), unit, hsn, qty: parseInt(qty)
  };
  updateOrderDisplay();
}

function removeProduct(id) {
  delete orderCart[id];
  updateOrderDisplay();
}

function updateOrderDisplay() {
  const itemsDiv = document.getElementById('order-items');
  let subBase = 0, totalGst = 0;
  
  if (!Object.keys(orderCart).length) {
    itemsDiv.innerHTML = '<p style="color:#999;">No items added yet</p>';
    updateTotal();
    return;
  }
  
  itemsDiv.innerHTML = Object.entries(orderCart).map(([id, item]) => {
    const subtotal = item.price * item.qty;
    const gstAmt = subtotal * (item.gst / 100);
    const lineTotal = subtotal + gstAmt;
    subBase += subtotal;
    totalGst += gstAmt;
    
    return `
      <div class="cart-item">
        <div class="cart-item-details">
          <div class="cart-item-name">${item.name}</div>
          <div class="cart-item-detail">${item.qty} × ₹${item.price.toFixed(0)} (GST ${item.gst}%)</div>
        </div>
        <input type="number" class="qty-input" value="${item.qty}" min="1" onchange="changeQty(${id}, this.value)">
        <div style="text-align:right;">
          <div class="cart-item-total">₹${lineTotal.toFixed(0)}</div>
          <button class="btn-danger" style="width:100%;padding:5px;margin:3px 0;font-size:11px;" onclick="removeProduct(${id})">✕</button>
        </div>
      </div>
    `;
  }).join('');
  
  document.getElementById('br-subtotal').textContent = '₹' + subBase.toFixed(0);
  document.getElementById('br-gst').textContent = '₹' + totalGst.toFixed(0);
  updateTotal();
}

function changeQty(id, qty) {
  const q = parseInt(qty) || 0;
  if (q <= 0) removeProduct(id);
  else { orderCart[id].qty = q; updateOrderDisplay(); }
}

function toggleDeliveryFields() {
  const show = document.getElementById('delivery-type').value === 'delivery';
  document.getElementById('delivery-section').style.display = show ? 'block' : 'none';
  updateTotal();
}

function updateTotal() {
  let subBase = 0, totalGst = 0;
  Object.values(orderCart).forEach(item => {
    const sub = item.price * item.qty;
    subBase += sub;
    totalGst += sub * (item.gst / 100);
  });
  
  const deliveryCost = parseFloat(document.getElementById('delivery-cost').value) || 0;
  const grand = subBase + totalGst + deliveryCost;
  
  document.getElementById('br-subtotal').textContent = '₹' + subBase.toFixed(0);
  document.getElementById('br-gst').textContent = '₹' + totalGst.toFixed(0);
  document.getElementById('br-delivery').textContent = '₹' + deliveryCost.toFixed(0);
  document.getElementById('br-total').textContent = '₹' + grand.toFixed(0);
}

async function loadOrders() {
  try {
    const { data } = await supabase
      .from('store_orders')
      .select('order_ref, status, customers(company_name), delivery_cost')
      .eq('staff_name', currentUser)
      .order('created_at', { ascending: false })
      .limit(10);
    
    const list = document.getElementById('orders-list');
    if (!data?.length) {
      list.innerHTML = '<p style="color:#999;">No orders yet</p>';
      return;
    }
    
    list.innerHTML = data.map(o => `
      <div class="order-card">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="order-card-ref">${o.order_ref}</span>
          <span class="order-card-status">${o.status}</span>
        </div>
        <div class="order-card-customer">${o.customers?.company_name || 'N/A'}</div>
        <div style="margin-top:6px;color:var(--saffron);font-weight:700;">₹${parseFloat(o.delivery_cost || 0).toFixed(0)}</div>
      </div>
    `).join('');
  } catch (err) {
    console.error('Orders error:', err);
  }
}

function resetForm() {
  orderCart = {};
  document.getElementById('cust-name').value = '';
  document.getElementById('cust-phone').value = '';
  document.getElementById('delivery-type').value = 'collect';
  document.getElementById('delivery-addr').value = '';
  document.getElementById('delivery-cost').value = '0';
  document.getElementById('logistics').value = '';
  document.getElementById('payment-type').value = 'cash';
  document.getElementById('order-notes').value = '';
  document.getElementById('delivery-section').style.display = 'none';
  updateOrderDisplay();
  document.getElementById('order-message').style.display = 'none';
}

async function submitOrder() {
  const custName = document.getElementById('cust-name').value.trim();
  const custPhone = document.getElementById('cust-phone').value.trim();
  const deliveryType = document.getElementById('delivery-type').value;
  const deliveryAddr = document.getElementById('delivery-addr').value.trim();
  const deliveryCost = parseFloat(document.getElementById('delivery-cost').value) || 0;
  const logistics = document.getElementById('logistics').value.trim();
  const paymentType = document.getElementById('payment-type').value;
  const notes = document.getElementById('order-notes').value.trim();
  
  if (!custName) { showMsg('order-message', 'Enter customer name', 'error'); return; }
  if (!Object.keys(orderCart).length) { showMsg('order-message', 'Add products to order', 'error'); return; }
  if (deliveryType === 'delivery' && !deliveryAddr) { showMsg('order-message', 'Enter delivery address', 'error'); return; }
  
  showMsg('order-message', 'Submitting order...', 'success');
  
  try {
    const { data: custData } = await supabase.from('customers').select('id').eq('company_name', custName).maybeSingle();
    let custId;
    
    if (custData) {
      custId = custData.id;
      await supabase.from('customers').update({ phone: custPhone }).eq('id', custId);
    } else {
      const { data: newCust } = await supabase.from('customers')
        .insert([{ company_name: custName, phone: custPhone }]).select('id').single();
      custId = newCust.id;
    }
    
    const orderRef = 'SO-' + Date.now().toString().slice(-6);
    const { data: orderData } = await supabase.from('store_orders')
      .insert([{ order_ref: orderRef, staff_name: currentUser, customer_id: custId, status: 'pending',
        delivery_mode: deliveryType, delivery_cost: deliveryCost, delivery_address: deliveryAddr,
        payment_type: paymentType, logistics_partner: logistics, notes: notes }])
      .select('id').single();
    
    const items = Object.entries(orderCart).map(([pid, item]) => ({
      order_id: orderData.id, product_id: parseInt(pid), product_name: item.name,
      hsn_code: item.hsn, unit: item.unit, qty: item.qty,
      base_price: item.price, gst_pct: item.gst, discount_pct: 0
    }));
    
    await supabase.from('store_items').insert(items);
    
    showMsg('order-message', `✓ Order ${orderRef} submitted successfully!`, 'success');
    setTimeout(() => goDashboard(), 2000);
  } catch (err) {
    console.error(err);
    showMsg('order-message', 'Error: ' + err.message, 'error');
  }
}

window.addEventListener('load', () => {
  document.getElementById('login-user').focus();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
});
</script>

</body>
</html>
