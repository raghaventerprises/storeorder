<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raghav Store App</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f5f5f5; }
.container { max-width: 500px; margin: 0 auto; background: white; min-height: 100vh; }
.header { background: #0F2D5E; color: white; padding: 15px; text-align: center; }
.content { padding: 15px; }
.section { display: none; }
.section.active { display: block; }
input, select, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 5px; font-size: 14px; font-weight: bold; cursor: pointer; }
.btn-primary { background: #E8520A; color: white; }
.btn-secondary { background: #0F2D5E; color: white; }
.btn-danger { background: #DC2626; color: white; }
.product { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 5px; cursor: pointer; background: #f9f9f9; }
.product:hover { background: #f0f0f0; }
.product-name { font-weight: bold; }
.product-price { color: #E8520A; font-weight: bold; }
.cart-item { border: 1px solid #ddd; padding: 10px; margin: 5px 0; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; }
.qty-input { width: 60px; padding: 5px; }
.total-box { background: #0F2D5E; color: white; padding: 15px; border-radius: 5px; margin: 15px 0; text-align: center; font-size: 20px; font-weight: bold; }
.error { color: red; padding: 10px; background: #ffe0e0; border-radius: 5px; margin: 10px 0; }
.success { color: green; padding: 10px; background: #e0ffe0; border-radius: 5px; margin: 10px 0; }
label { display: block; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>💳 Raghav Store</h1>
    <p id="username-display"></p>
  </div>

  <div class="content">
    
    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="section active">
      <h2>Staff Login</h2>
      <input type="text" id="login-user" placeholder="Username: baburaj, selvin, warehouse">
      <input type="password" id="login-pin" placeholder="PIN" maxlength="4">
      <button class="btn-secondary" onclick="login()">Login</button>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="section">
      <h2>Your Orders</h2>
      <button class="btn-primary" onclick="goToNewOrder()">+ New Order</button>
      <div id="orders-list"></div>
      <button class="btn-danger" onclick="logout()">Logout</button>
    </div>

    <!-- NEW ORDER -->
    <div id="new-order" class="section">
      <h2>New Order</h2>
      <button class="btn-secondary" onclick="goDashboard()">← Back</button>
      
      <label>Customer Name *</label>
      <input type="text" id="cust-name" placeholder="e.g. ABC Builders">
      
      <label>Phone</label>
      <input type="tel" id="cust-phone" placeholder="+91...">
      
      <label>Select Product *</label>
      <div id="products-container"></div>
      
      <label>Delivery Type *</label>
      <select id="delivery-type">
        <option value="collect">Collect from store</option>
        <option value="delivery">Delivery</option>
      </select>
      
      <div id="delivery-fields" style="display:none;">
        <label>Delivery Address</label>
        <textarea id="delivery-addr" placeholder="Site location..."></textarea>
        <label>Delivery Cost (₹)</label>
        <input type="number" id="delivery-cost" value="0">
        <label>Logistics Partner</label>
        <input type="text" id="logistics" placeholder="Name or company">
      </div>
      
      <label>Payment Type</label>
      <select id="payment-type">
        <option value="cash">Cash</option>
        <option value="credit">Credit</option>
      </select>
      
      <label>Notes</label>
      <textarea id="order-notes" placeholder="Special instructions..."></textarea>
      
      <h3>Order Items</h3>
      <div id="order-items"></div>
      
      <div class="total-box" id="order-total">₹0</div>
      
      <button class="btn-primary" onclick="submitOrder()">Submit Order</button>
      <div id="message"></div>
    </div>

  </div>
</div>

<script>
const SUPABASE_URL = 'https://cuxfvbtvmosmgvptygjy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN1eGZ2YnR2bW9zbWd2cHR5Z2p5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MDk5NzYsImV4cCI6MjA5NjA4NTk3Nn0.tuSqeeKONTldWAX1mDwXJAuIjs3o2amcNbfvns-OH4o';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const STAFF = {
  baburaj: '1111',
  selvin: '2222',
  warehouse: '3333'
};

let currentUser = null;
let allProducts = [];
let orderCart = {};

document.getElementById('delivery-type').addEventListener('change', function() {
  document.getElementById('delivery-fields').style.display = 
    this.value === 'delivery' ? 'block' : 'none';
});

function showMessage(text, type) {
  const msg = document.getElementById('message');
  msg.textContent = text;
  msg.className = type;
}

function login() {
  const user = document.getElementById('login-user').value.toLowerCase().trim();
  const pin = document.getElementById('login-pin').value.trim();
  
  if (!user || !pin) {
    showMessage('Enter username and PIN', 'error');
    return;
  }
  
  if (STAFF[user] !== pin) {
    showMessage('Invalid credentials', 'error');
    return;
  }
  
  currentUser = user;
  document.getElementById('username-display').textContent = user.toUpperCase();
  document.getElementById('login-screen').classList.remove('active');
  document.getElementById('dashboard').classList.add('active');
  
  loadProducts();
  loadOrders();
}

function logout() {
  currentUser = null;
  orderCart = {};
  document.getElementById('login-screen').classList.add('active');
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('new-order').classList.remove('active');
  document.getElementById('login-user').value = '';
  document.getElementById('login-pin').value = '';
}

function goDashboard() {
  document.getElementById('new-order').classList.remove('active');
  document.getElementById('dashboard').classList.add('active');
  loadOrders();
}

function goToNewOrder() {
  resetForm();
  document.getElementById('dashboard').classList.remove('active');
  document.getElementById('new-order').classList.add('active');
}

async function loadProducts() {
  try {
    const { data, error } = await supabase
      .from('products')
      .select('id, name, base_price, gst_pct, unit, hsn_code, category')
      .eq('is_active', true)
      .order('name');
    
    if (error) throw error;
    
    allProducts = data || [];
    displayProducts();
  } catch (error) {
    console.error('Error loading products:', error);
    showMessage('Error loading products', 'error');
  }
}

function displayProducts() {
  const container = document.getElementById('products-container');
  
  if (allProducts.length === 0) {
    container.innerHTML = '<p style="color:red;">No products available</p>';
    return;
  }
  
  container.innerHTML = allProducts.map(p => `
    <div class="product" onclick="addProduct(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.base_price}, ${p.gst_pct}, '${p.unit}', '${p.hsn_code}')">
      <div class="product-name">${p.name}</div>
      <div style="font-size:12px; color:#666;">${p.unit} | HSN: ${p.hsn_code}</div>
      <div class="product-price">₹${parseFloat(p.base_price).toFixed(2)}</div>
    </div>
  `).join('');
}

function addProduct(id, name, price, gst, unit, hsn) {
  const qty = prompt(`How many ${unit} of ${name}?`, '1');
  if (!qty || isNaN(qty) || qty <= 0) return;
  
  orderCart[id] = {
    name: name,
    price: price,
    gst: gst,
    unit: unit,
    hsn: hsn,
    qty: parseInt(qty)
  };
  
  updateOrderDisplay();
}

function updateOrderDisplay() {
  const itemsDiv = document.getElementById('order-items');
  let total = 0;
  
  if (Object.keys(orderCart).length === 0) {
    itemsDiv.innerHTML = '<p style="color:#999;">No items added</p>';
    document.getElementById('order-total').textContent = '₹0';
    return;
  }
  
  itemsDiv.innerHTML = Object.entries(orderCart).map(([id, item]) => {
    const subtotal = item.price * item.qty;
    const gstAmount = subtotal * (item.gst / 100);
    const lineTotal = subtotal + gstAmount;
    total += lineTotal;
    
    return `
      <div class="cart-item">
        <div>
          <strong>${item.name}</strong><br>
          ${item.qty} × ₹${parseFloat(item.price).toFixed(2)} = ₹${lineTotal.toFixed(2)}
        </div>
        <button class="btn-danger" style="width:80px;" onclick="removeProduct(${id})">Remove</button>
      </div>
    `;
  }).join('');
  
  const deliveryCost = parseFloat(document.getElementById('delivery-cost').value) || 0;
  const grandTotal = total + deliveryCost;
  document.getElementById('order-total').textContent = '₹' + grandTotal.toFixed(2);
}

function removeProduct(id) {
  delete orderCart[id];
  updateOrderDisplay();
}

async function loadOrders() {
  try {
    const { data, error } = await supabase
      .from('store_orders')
      .select('id, order_ref, status, customer_id, customers(company_name), delivery_cost')
      .eq('staff_name', currentUser)
      .order('created_at', { ascending: false });
    
    if (error) throw error;
    
    const ordersList = document.getElementById('orders-list');
    if (!data || data.length === 0) {
      ordersList.innerHTML = '<p style="color:#999;">No orders yet</p>';
      return;
    }
    
    ordersList.innerHTML = data.map(o => `
      <div style="border:1px solid #ddd; padding:10px; margin:10px 0; border-radius:5px;">
        <strong>${o.order_ref}</strong> | ${o.customers?.company_name || 'N/A'}<br>
        Status: <strong>${o.status}</strong><br>
        Delivery: ₹${parseFloat(o.delivery_cost || 0).toFixed(2)}
      </div>
    `).join('');
  } catch (error) {
    console.error('Error loading orders:', error);
  }
}

function resetForm() {
  orderCart = {};
  document.getElementById('cust-name').value = '';
  document.getElementById('cust-phone').value = '';
  document.getElementById('delivery-type').value = 'collect';
  document.getElementById('delivery-addr').value = '';
  document.getElementById('delivery-cost').value = '0';
  document.getElementById('logistics').value = '';
  document.getElementById('payment-type').value = 'cash';
  document.getElementById('order-notes').value = '';
  document.getElementById('delivery-fields').style.display = 'none';
  updateOrderDisplay();
  document.getElementById('message').textContent = '';
}

async function submitOrder() {
  const custName = document.getElementById('cust-name').value.trim();
  const custPhone = document.getElementById('cust-phone').value.trim();
  const deliveryType = document.getElementById('delivery-type').value;
  const deliveryAddr = document.getElementById('delivery-addr').value.trim();
  const deliveryCost = parseFloat(document.getElementById('delivery-cost').value) || 0;
  const logistics = document.getElementById('logistics').value.trim();
  const paymentType = document.getElementById('payment-type').value;
  const notes = document.getElementById('order-notes').value.trim();
  
  if (!custName) {
    showMessage('Enter customer name', 'error');
    return;
  }
  
  if (Object.keys(orderCart).length === 0) {
    showMessage('Add products to order', 'error');
    return;
  }
  
  if (deliveryType === 'delivery' && !deliveryAddr) {
    showMessage('Enter delivery address', 'error');
    return;
  }
  
  showMessage('Submitting order...', 'success');
  
  try {
    // Get or create customer
    const { data: custData } = await supabase
      .from('customers')
      .select('id')
      .eq('company_name', custName)
      .maybeSingle();
    
    let custId;
    if (custData) {
      custId = custData.id;
      await supabase.from('customers').update({ phone: custPhone }).eq('id', custId);
    } else {
      const { data: newCust } = await supabase
        .from('customers')
        .insert([{ company_name: custName, phone: custPhone }])
        .select('id')
        .single();
      custId = newCust.id;
    }
    
    // Create order
    const orderRef = 'SO-' + Date.now().toString().slice(-6);
    const { data: orderData } = await supabase
      .from('store_orders')
      .insert([{
        order_ref: orderRef,
        staff_name: currentUser,
        customer_id: custId,
        status: 'pending',
        delivery_mode: deliveryType,
        delivery_cost: deliveryCost,
        delivery_address: deliveryAddr,
        payment_type: paymentType,
        logistics_partner: logistics,
        notes: notes
      }])
      .select('id')
      .single();
    
    // Add items
    const items = Object.entries(orderCart).map(([prodId, item]) => ({
      order_id: orderData.id,
      product_id: parseInt(prodId),
      product_name: item.name,
      hsn_code: item.hsn,
      unit: item.unit,
      qty: item.qty,
      base_price: item.price,
      gst_pct: item.gst,
      discount_pct: 0
    }));
    
    await supabase.from('store_items').insert(items);
    
    showMessage(`✓ Order ${orderRef} submitted successfully!`, 'success');
    setTimeout(() => goDashboard(), 2000);
  } catch (error) {
    console.error('Error submitting order:', error);
    showMessage('Error submitting order: ' + error.message, 'error');
  }
}

window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('login-user').focus();
});
</script>

</body>
</html>
